<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prospect Rank</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="src/chart.css">
</head>
<body class="popup">
  <h1>Prospect Rank</h1>
  <p class="muted" id="current"></p>
  <label class="toggle"><input type="checkbox" id="enabled"> Show badges on eBay</label>
  <label class="toggle"><input type="checkbox" id="saveSales"> Save sold prices <span class="muted" id="sales-count"></span></label>
  <div class="row"><input type="search" id="q" placeholder="Look up a player" autofocus></div>
  <ul class="results" id="results"></ul>
  <div class="row"><button id="open">Import or update list</button></div>
  <script src="src/match.js"></script>
  <script src="src/history.js"></script>
  <script src="src/chart.js"></script>
  <script src="popup.js"></script>
</body>
</html>
